<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Biblioteka{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'lista' %}"><i class="bi bi-book"></i> Biblioteka</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="{% url 'lista' %}">Książki</a>
        <a class="nav-link" href="{% url 'dodaj' %}">Dodaj</a>
        <a class="nav-link" href="{% url 'czytelnicy' %}">Czytelnicy</a>
        <a class="nav-link" href="{% url 'wypozyczenia' %}">Wypożyczenia</a>
        <a class="nav-link" href="/admin/">Panel admina</a>
      </div>
    </div>
  </nav>
  <main class="container">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
