{% extends 'ksiazki/base.html' %}
{% block title %}{{ naglowek }} – Biblioteka{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header"><h1 class="h5 mb-0">{{ naglowek }}</h1></div>
      <div class="card-body">
        <form method="post" novalidate>
          {% csrf_token %}
          {% for field in form %}
          <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
          </div>
          {% endfor %}
          <button class="btn btn-primary"><i class="bi bi-save"></i> Zapisz</button>
          <a href="{% url anuluj_url %}" class="btn btn-secondary">Anuluj</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
