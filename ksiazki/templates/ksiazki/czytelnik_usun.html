{% extends 'ksiazki/base.html' %}
{% block title %}Usuń czytelnika – Biblioteka{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card border-danger shadow-sm">
      <div class="card-body">
        <h1 class="h5">Usunąć czytelnika?</h1>
        <p>Czy na pewno chcesz usunąć <strong>{{ czytelnik }}</strong> ({{ czytelnik.email }})?</p>
        <form method="post">
          {% csrf_token %}
          <button class="btn btn-danger">Tak, usuń</button>
          <a href="{% url 'czytelnicy' %}" class="btn btn-secondary">Anuluj</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
